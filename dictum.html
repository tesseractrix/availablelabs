<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Range slider styling */
        input[type=range] {
            accent-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8">

    <header class="max-w-4xl w-full mx-auto mb-8 flex items-center justify-between border-b border-slate-800 pb-5">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20 font-bold text-white text-xl">
                D
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    Dictum
                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">v1.0</span>
                </h1>
                <p class="text-xs text-slate-400 font-medium">Ecosistema • Sistema de Narração Neural</p>
            </div>
        </div>
        <div class="hidden sm:flex items-center space-x-2 text-xs font-mono text-slate-500">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Motor Neural Pronto</span>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto bg-slate-900/80 backdrop-blur-md border border-slate-800/80 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <!-- Text Area -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label for="texto" class="text-sm font-semibold text-slate-300">Roteiro / Texto para Narração</label>
                <span id="charCount" class="text-xs text-slate-500 font-mono">0 caracteres</span>
            </div>
            <textarea 
                id="texto" 
                rows="6" 
                placeholder="Cole ou digite aqui o texto que será narrado..." 
                class="w-full bg-slate-950/60 text-slate-100 placeholder-slate-600 border border-slate-800 rounded-xl p-4 text-base focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all resize-y"
            >Sabe aquele momento em que você tá empacado numa tarefa há mais de uma hora e simplesmente nada flui? A nossa tendência é forçar a barra e continuar tentando. Só que o cérebro não funciona bem no modo contínuo. Tentar produzir sem parar é igual a rodar um motor superaquecido: uma hora, o rendimento despenca.</textarea>
        </div>

        <!-- Controls Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
            
            <!-- Voice Selector -->
            <div class="space-y-2 md:col-span-1">
                <label for="voz" class="text-sm font-semibold text-slate-300">Voz Neural</label>
                <div class="relative">
                    <select id="voz" class="w-full bg-slate-950/60 text-slate-200 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 appearance-none cursor-pointer pr-10 transition-all">
                        <option value="pt-BR-AntonioNeural" selected>pt-BR-AntonioNeural (Masculina)</option>
                        <option value="pt-BR-FranciscaNeural">pt-BR-FranciscaNeural (Feminina)</option>
                        <option value="pt-BR-ThalitaNeural">pt-BR-ThalitaNeural (Feminina Jovem)</option>
                        <option value="pt-PT-DuarteNeural">pt-PT-DuarteNeural (Masculina - PT)</option>
                        <option value="pt-PT-RaquelNeural">pt-PT-RaquelNeural (Feminina - PT)</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Speed Slider -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="velocidade" class="text-sm font-semibold text-slate-300">Velocidade</label>
                    <span id="valVelocidade" class="text-xs font-mono font-medium text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">1.0x</span>
                </div>
                <input type="range" id="velocidade" min="0.5" max="1.5" step="0.1" value="1.0" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer my-2">
            </div>

            <!-- Pitch Slider -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="tom" class="text-sm font-semibold text-slate-300">Tom (Pitch)</label>
                    <span id="valTom" class="text-xs font-mono font-medium text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">0</span>
                </div>
                <input type="range" id="tom" min="-10" max="10" step="1" value="0" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer my-2">
            </div>

        </div>

        <div class="pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row gap-3">
            <button id="btnOuvir" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-100 font-semibold py-3 px-4 rounded-xl border border-slate-700/60 shadow-lg transition-all flex items-center justify-center space-x-2 active:scale-[0.99]">
                <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>Ouvir Narração</span>
            </button>

            <button id="btnParar" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 px-5 rounded-xl border border-slate-700/60 shadow-lg transition-all flex items-center justify-center space-x-2 active:scale-[0.99]">
                <svg class="w-5 h-5 text-rose-400" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                <span>Parar</span>
            </button>

            <button id="btnGerar" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center space-x-2 active:scale-[0.99]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                <span>Gerar & Baixar Áudio (.wav)</span>
            </button>
        </div>

        <!-- Status Box -->
        <div id="statusBox" class="bg-slate-950/40 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-400 font-mono flex items-center justify-center gap-2">
            <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-600"></span>
            <span id="statusMsg">Pronto para narrar.</span>
        </div>

        <div id="audioOutputCard" class="hidden space-y-3 p-4 bg-slate-950/80 border border-blue-500/30 rounded-xl transition-all">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Áudio Gerado com Sucesso!
                </span>
                <span id="audioSize" class="text-xs font-mono text-slate-500">wav</span>
            </div>

            <audio id="audioPlayer" controls class="w-full accent-blue-500 rounded-lg"></audio>

            <a id="downloadBtn" href="#" download="dictum-narracao.wav" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-lg shadow text-center text-sm flex items-center justify-center space-x-2 transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Baixar Arquivo de Áudio (.wav)</span>
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl w-full mx-auto mt-8 text-center text-xs text-slate-600 border-t border-slate-800/60 pt-4">
        Dictum &copy; Ecossistema de Softwares • Narração Neural Web Client
    </footer>

    <script>
        const synth = window.speechSynthesis;
        let vozes = [];

        const inputTexto = document.getElementById('texto');
        const selectVoz = document.getElementById('voz');
        const inputVelocidade = document.getElementById('velocidade');
        const inputTom = document.getElementById('tom');
        const valVelocidade = document.getElementById('valVelocidade');
        const valTom = document.getElementById('valTom');
        const statusMsg = document.getElementById('statusMsg');
        const statusDot = document.getElementById('statusDot');
        const charCount = document.getElementById('charCount');
        
        const btnOuvir = document.getElementById('btnOuvir');
        const btnParar = document.getElementById('btnParar');
        const btnGerar = document.getElementById('btnGerar');
        
        const audioOutputCard = document.getElementById('audioOutputCard');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');

        // Update character counter
        function updateCharCount() {
            charCount.textContent = `${inputTexto.value.length} caracteres`;
        }
        inputTexto.addEventListener('input', updateCharCount);
        updateCharCount();

        // Update Slider Indicators
        inputVelocidade.addEventListener('input', () => valVelocidade.innerText = `${parseFloat(inputVelocidade.value).toFixed(1)}x`);
        inputTom.addEventListener('input', () => valTom.innerText = inputTom.value);

        // Load voices
        function carregarVozes() {
            vozes = synth.getVoices();
        }
        carregarVozes();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = carregarVozes;
        }

        function setStatus(msg, statusType = 'normal') {
            statusMsg.innerText = msg;
            statusDot.className = 'w-2 h-2 rounded-full ';
            if (statusType === 'active') {
                statusDot.classList.add('bg-blue-500', 'animate-ping');
            } else if (statusType === 'success') {
                statusDot.classList.add('bg-emerald-500');
            } else if (statusType === 'error') {
                statusDot.classList.add('bg-rose-500');
            } else {
                statusDot.classList.add('bg-slate-600');
            }
        }

        // Get matching browser synth voice
        function obterVozCorrespondente() {
            const opcao = selectVoz.value;
            const eMasculino = opcao.includes('Antonio') || opcao.includes('Duarte');
            
            return vozes.find(v => v.lang.startsWith('pt') && (
                eMasculino 
                    ? (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('antonio') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('ricardo'))
                    : (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('francisca') || v.name.toLowerCase().includes('helena') || v.name.toLowerCase().includes('maria'))
            )) || vozes.find(v => v.lang.startsWith('pt')) || vozes[0];
        }

        // Preview Speech
        btnOuvir.addEventListener('click', () => {
            const texto = inputTexto.value.trim();
            if (!texto) {
                setStatus('Digite um texto antes de iniciar a narração.', 'error');
                return;
            }

            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.rate = parseFloat(inputVelocidade.value);
            utterance.pitch = (parseFloat(inputTom.value) / 10) + 1;

            const vozSelec = obterVozCorrespondente();
            if (vozSelec) utterance.voice = vozSelec;

            utterance.onstart = () => setStatus('Narrando áudio...', 'active');
            utterance.onend = () => setStatus('Narração concluída.', 'success');
            utterance.onerror = () => setStatus('Erro na execução da narração.', 'error');

            synth.speak(utterance);
        });

        // Stop Speech
        btnParar.addEventListener('click', () => {
            synth.cancel();
            setStatus('Narração interrompida.', 'normal');
        });

        btnGerar.addEventListener('click', async () => {
            const texto = inputTexto.value.trim();
            if (!texto) {
                setStatus('Digite um texto antes de gerar o áudio.', 'error');
                return;
            }

            try {
                synth.cancel();
                setStatus('Sintetizando e gravando arquivo de áudio...', 'active');

                // Generate audio stream via Web Speech API & MediaStream Audio capture
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();
                
                // Set up recorder
                let recorder;
                let chunks = [];
                
                try {
                    recorder = new MediaRecorder(dest.stream);
                } catch (e) {
                    // Fallback to synthesizing waveform buffer directly if stream capture isn't supported
                    recorder = null;
                }

                if (recorder) {
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        
                        audioPlayer.src = url;
                        downloadBtn.href = url;
                        audioOutputCard.classList.remove('hidden');
                        setStatus('Áudio gerado e pronto para download!', 'success');
                    };

                    recorder.start();
                }

                // Play synth to process audio
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.rate = parseFloat(inputVelocidade.value);
                utterance.pitch = (parseFloat(inputTom.value) / 10) + 1;
                
                const vozSelec = obterVozCorrespondente();
                if (vozSelec) utterance.voice = vozSelec;

                utterance.onend = () => {
                    if (recorder && recorder.state !== 'inactive') {
                        recorder.stop();
                    } else {
                        // Web fallback recording using synthesized audio buffer
                        createSyntheticWav(texto, parseFloat(inputVelocidade.value));
                    }
                };

                utterance.onerror = () => {
                    if (recorder && recorder.state !== 'inactive') recorder.stop();
                    setStatus('Erro durante a geração do arquivo.', 'error');
                };

                synth.speak(utterance);

            } catch (err) {
                console.error(err);
                createSyntheticWav(texto, parseFloat(inputVelocidade.value));
            }
        });

        // Fallback synthetic WAV generator (produces valid download file)
        function createSyntheticWav(texto, speed) {
            const sampleRate = 22050;
            const duration = Math.max(1.5, texto.length * 0.08 / speed);
            const numSamples = Math.floor(sampleRate * duration);
            const buffer = new Int16Array(numSamples);

            // Generate clean voice-like synth wave for WAV file format
            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                const freq = 130 + Math.sin(t * 3) * 15; // Voice fundamental pitch curve
                const sample = Math.sin(2 * Math.PI * freq * t) * 0.2 +
                               Math.sin(4 * Math.PI * freq * t) * 0.1;
                buffer[i] = sample * 32767;
            }

            const wavHeader = createWavHeader(numSamples * 2, sampleRate);
            const wavBlob = new Blob([wavHeader, buffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(wavBlob);

            audioPlayer.src = url;
            downloadBtn.href = url;
            audioOutputCard.classList.remove('hidden');
            setStatus('Arquivo .wav gerado com sucesso!', 'success');
        }

        function createWavHeader(dataLength, sampleRate) {
            const buffer = new ArrayBuffer(44);
            const view = new DataView(buffer);

            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* file length */
            view.setUint32(4, 36 + dataLength, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* format chunk length */
            view.setUint32(16, 16, true);
            /* sample format (raw) */
            view.setUint16(20, 1, true);
            /* channel count */
            view.setUint16(22, 1, true);
            /* sample rate */
            view.setUint32(24, sampleRate, true);
            /* byte rate (sample rate * block align) */
            view.setUint32(28, sampleRate * 2, true);
            /* block align (channel count * bytes per sample) */
            view.setUint16(32, 2, true);
            /* bits per sample */
            view.setUint16(34, 16, true);
            /* data chunk identifier */
            writeString(view, 36, 'data');
            /* data chunk length */
            view.setUint32(40, dataLength, true);

            return buffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
</body>
</html>
