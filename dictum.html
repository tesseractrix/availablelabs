<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictum - Sistema de Narração Neural</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eep2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-10 bg-[#0b0f19] text-slate-100">

    <header class="max-w-4xl w-full mx-auto mb-8 flex items-center justify-between border-b border-slate-800/80 pb-5">
        <div class="flex items-center space-x-3.5">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 font-bold text-white text-2xl tracking-wider">
                D
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2.5">
                    Dictum
                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">v2.0 Neural</span>
                </h1>
                <p class="text-xs text-slate-400 font-medium">Ecossistema • Sistema de Narração Neural</p>
            </div>
        </div>
        <div class="hidden sm:flex items-center space-x-2 text-xs font-mono text-slate-400 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-800">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Motor Neural Edge Conectado</span>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <!-- Textarea area -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label for="texto" class="text-sm font-semibold text-slate-200">Roteiro / Texto para Narração</label>
                <span id="charCount" class="text-xs text-slate-500 font-mono">0 caracteres</span>
            </div>
            <textarea 
                id="texto" 
                rows="6" 
                placeholder="Digite ou cole aqui o seu roteiro..." 
                class="w-full bg-slate-950/80 text-slate-100 placeholder-slate-600 border border-slate-800 rounded-xl p-4 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all resize-y"
            ></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-1">
            
            <!-- Voice Selector -->
            <div class="space-y-2">
                <label for="voz" class="text-sm font-semibold text-slate-200">Voz Neural</label>
                <div class="relative">
                    <select id="voz" class="w-full bg-slate-950/80 text-slate-200 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 appearance-none cursor-pointer pr-10 transition-all">
                        <option value="pt-BR-AntonioNeural" selected>pt-BR-AntonioNeural (Masculino - Padrão)</option>
                        <option value="pt-BR-HumbertoNeural">pt-BR-HumbertoNeural (Masculino)</option>
                        <option value="pt-BR-FranciscaNeural">pt-BR-FranciscaNeural (Feminino)</option>
                        <option value="pt-BR-ThalitaNeural">pt-BR-ThalitaNeural (Feminino Jovem)</option>
                        <option value="pt-PT-DuarteNeural">pt-PT-DuarteNeural (Masculino - Portugal)</option>
                        <option value="pt-PT-RaquelNeural">pt-PT-RaquelNeural (Feminino - Portugal)</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Speed Slider -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="velocidade" class="text-sm font-semibold text-slate-200">Velocidade</label>
                    <span id="valVelocidade" class="text-xs font-mono font-medium text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">0%</span>
                </div>
                <input type="range" id="velocidade" min="-50" max="50" step="5" value="0" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer my-2 accent-indigo-500">
            </div>

            <!-- Pitch Slider -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="tom" class="text-sm font-semibold text-slate-200">Tom (Pitch)</label>
                    <span id="valTom" class="text-xs font-mono font-medium text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">0Hz</span>
                </div>
                <input type="range" id="tom" min="-20" max="20" step="1" value="0" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer my-2 accent-indigo-500">
            </div>

        </div>

        <div class="pt-4 border-t border-slate-800 flex flex-col sm:flex-row gap-3">
            <button id="btnOuvir" class="bg-slate-800 hover:bg-slate-700 text-slate-100 font-semibold py-3 px-5 rounded-xl border border-slate-700/70 shadow-lg transition-all flex items-center justify-center space-x-2 active:scale-[0.98]">
                <svg class="w-5 h-5 text-indigo-400" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>Ouvir Prévia</span>
            </button>

            <button id="btnParar" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 px-5 rounded-xl border border-slate-700/70 shadow-lg transition-all flex items-center justify-center space-x-2 active:scale-[0.98]">
                <svg class="w-5 h-5 text-rose-400" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                <span>Parar</span>
            </button>

            <button id="btnGerar" class="flex-1 bg-gradient-to-r from-indigo-600 via-indigo-500 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-semibold py-3 px-5 rounded-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center space-x-2.5 active:scale-[0.98]">
                <svg id="btnGerarIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span id="btnGerarTexto">Gerar & Baixar Áudio (.mp3)</span>
            </button>
        </div>

        <div id="statusBox" class="bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 text-center text-xs text-slate-400 font-mono flex items-center justify-center gap-2.5">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-slate-600"></span>
            <span id="statusMsg">Pronto para processar narração.</span>
        </div>

        <!-- Generated Audio Download Box -->
        <div id="audioOutputCard" class="hidden space-y-4 p-5 bg-slate-950/90 border border-indigo-500/30 rounded-xl transition-all">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-emerald-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Áudio Gerado com Sucesso!
                </span>
                <span id="audioSize" class="text-xs font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded border border-slate-800">0 KB</span>
            </div>

            <audio id="audioPlayer" controls class="w-full accent-indigo-500 rounded-lg"></audio>

            <a id="downloadBtn" href="#" download="dictum-narracao.mp3" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg text-center text-sm flex items-center justify-center space-x-2 transition-all active:scale-[0.99]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Baixar Arquivo MP3</span>
            </a>
        </div>

    </main>

    <footer class="max-w-4xl w-full mx-auto mt-8 text-center text-xs text-slate-600 border-t border-slate-800/80 pt-4">
        Dictum &copy; Ecossistema de Softwares • Narração Neural com Edge TTS Direct WebSocket
    </footer>

    <script>
        const synth = window.speechSynthesis;
        let vozesWeb = [];

        // DOM Elements
        const inputTexto = document.getElementById('texto');
        const selectVoz = document.getElementById('voz');
        const inputVelocidade = document.getElementById('velocidade');
        const inputTom = document.getElementById('tom');
        const valVelocidade = document.getElementById('valVelocidade');
        const valTom = document.getElementById('valTom');
        const statusMsg = document.getElementById('statusMsg');
        const statusDot = document.getElementById('statusDot');
        const charCount = document.getElementById('charCount');
        
        const btnOuvir = document.getElementById('btnOuvir');
        const btnParar = document.getElementById('btnParar');
        const btnGerar = document.getElementById('btnGerar');
        const btnGerarTexto = document.getElementById('btnGerarTexto');
        const btnGerarIcon = document.getElementById('btnGerarIcon');
        
        const audioOutputCard = document.getElementById('audioOutputCard');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');
        const audioSize = document.getElementById('audioSize');

        // Character counter
        function updateCharCount() {
            charCount.textContent = `${inputTexto.value.length} caracteres`;
        }
        inputTexto.addEventListener('input', updateCharCount);
        updateCharCount();

        // Sliders formatting
        inputVelocidade.addEventListener('input', () => {
            const val = parseInt(inputVelocidade.value);
            valVelocidade.innerText = `${val >= 0 ? '+' : ''}${val}%`;
        });
        
        inputTom.addEventListener('input', () => {
            const val = parseInt(inputTom.value);
            valTom.innerText = `${val >= 0 ? '+' : ''}${val}Hz`;
        });

        // Load web voices for live preview
        function carregarVozes() {
            vozesWeb = synth.getVoices();
        }
        carregarVozes();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = carregarVozes;
        }

        // Status update helper
        function setStatus(msg, type = 'normal') {
            statusMsg.innerText = msg;
            statusDot.className = 'w-2.5 h-2.5 rounded-full ';
            if (type === 'loading') {
                statusDot.classList.add('bg-indigo-400', 'animate-ping');
            } else if (type === 'active') {
                statusDot.classList.add('bg-blue-400', 'animate-pulse');
            } else if (type === 'success') {
                statusDot.classList.add('bg-emerald-400');
            } else if (type === 'error') {
                statusDot.classList.add('bg-rose-500');
            } else {
                statusDot.classList.add('bg-slate-600');
            }
        }

        // --- 1) LIVE PREVIEW (Ouvir) ---
        btnOuvir.addEventListener('click', () => {
            const texto = inputTexto.value.trim();
            if (!texto) {
                setStatus('Por favor, insira um texto para reproduzir.', 'error');
                return;
            }

            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.rate = 1 + (parseInt(inputVelocidade.value) / 100);
            utterance.pitch = 1 + (parseInt(inputTom.value) / 20);

            const vozEscolhida = selectVoz.value;
            const eMasculino = vozEscolhida.includes('Antonio') || vozEscolhida.includes('Humberto') || vozEscolhida.includes('Duarte');
            
            const vozWeb = vozesWeb.find(v => v.lang.startsWith('pt') && (
                eMasculino 
                    ? (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('antonio') || v.name.toLowerCase().includes('daniel'))
                    : (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('francisca') || v.name.toLowerCase().includes('helena'))
            )) || vozesWeb.find(v => v.lang.startsWith('pt'));

            if (vozWeb) utterance.voice = vozWeb;

            utterance.onstart = () => setStatus('Reproduzindo prévia ao vivo...', 'active');
            utterance.onend = () => setStatus('Prévia concluída.', 'success');
            utterance.onerror = () => setStatus('Erro ao tentar reproduzir a prévia.', 'error');

            synth.speak(utterance);
        });

        btnParar.addEventListener('click', () => {
            synth.cancel();
            setStatus('Reprodução interrompida.', 'normal');
        });

        async function gerarAudioNeuralSilencioso(texto, voz, rateStr, pitchStr) {
            return new Promise((resolve, reject) => {
                const TRUSTED_CLIENT_TOKEN = "6A5AA1D4EA5F400B92921122C3D32F46";
                const wsUrl = `wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=${TRUSTED_CLIENT_TOKEN}`;
                
                const socket = new WebSocket(wsUrl);
                const audioChunks = [];

                socket.binaryType = "arraybuffer";

                socket.onopen = () => {
                    // Send Config Message
                    const configMsg = "Content-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n" +
                        JSON.stringify({
                            context: {
                                synthesis: {
                                    audio: {
                                        metadataversion: "A",
                                        outputFormat: "audio-24khz-48kbitrate-mono-mp3"
                                    }
                                }
                            }
                        });
                    socket.send(configMsg);

                    // Send SSML Message
                    const requestId = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                        .map(b => b.toString(16).padStart(2, '0')).join('');

                    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='pt-BR'>` +
                        `<voice name='${voz}'>` +
                        `<prosody rate='${rateStr}' pitch='${pitchStr}'>` +
                        `${escapeXml(texto)}` +
                        `</prosody></voice></speak>`;

                    const ssmlMsg = `X-RequestId:${requestId}\r\nContent-Type:application/ssml+xml\r\nPath:ssml\r\n\r\n${ssml}`;
                    socket.send(ssmlMsg);
                };

                socket.onmessage = (event) => {
                    if (typeof event.data === "string") {
                        if (event.data.includes("Path:turn.end")) {
                            socket.close();
                            const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                            resolve(blob);
                        }
                    } else if (event.data instanceof ArrayBuffer) {
                        const view = new DataView(event.data);
                        const headerLength = view.getUint16(0);
                        if (event.data.byteLength > headerLength + 2) {
                            const audioData = event.data.slice(headerLength + 2);
                            audioChunks.push(audioData);
                        }
                    }
                };

                socket.onerror = (err) => {
                    reject(err);
                };

                socket.onclose = (event) => {
                    if (audioChunks.length > 0) {
                        const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                        resolve(blob);
                    } else {
                        reject(new Error("Conexão encerrada antes de receber áudio."));
                    }
                };
            });
        }

        function escapeXml(str) {
            return str.replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }

        // --- 2) SILENT GENERATION & DOWNLOAD ---
        btnGerar.addEventListener('click', async () => {
            const texto = inputTexto.value.trim();
            if (!texto) {
                setStatus('Por favor, insira o texto a ser sintetizado.', 'error');
                return;
            }

            // Stop any playing speech preview
            synth.cancel();

            // Set UI Loading State
            btnGerar.disabled = true;
            btnOuvir.disabled = true;
            btnGerar.classList.add('opacity-60', 'cursor-not-allowed');
            btnGerarTexto.innerText = "Gerando áudio, por favor aguarde...";
            btnGerarIcon.innerHTML = `<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>`;
            btnGerarIcon.classList.add('animate-spin');

            setStatus('Gerando áudio em segundo plano, por favor aguarde...', 'loading');
            audioOutputCard.classList.add('hidden');

            try {
                const voz = selectVoz.value;
                const rateVal = parseInt(inputVelocidade.value);
                const pitchVal = parseInt(inputTom.value);

                const rateStr = `${rateVal >= 0 ? '+' : ''}${rateVal}%`;
                const pitchStr = `${pitchVal >= 0 ? '+' : ''}${pitchVal}Hz`;

                // Fetch real MP3 bytes from Edge Speech API silently
                const audioBlob = await gerarAudioNeuralSilencioso(texto, voz, rateStr, pitchStr);

                if (audioBlob.size === 0) {
                    throw new Error("O áudio retornado contém 0 bytes.");
                }

                // Prepare file download and player URL
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPlayer.src = audioUrl;
                downloadBtn.href = audioUrl;
                downloadBtn.download = `dictum-${voz}-${Date.now()}.mp3`;

                // Format filesize
                const kb = (audioBlob.size / 1024).toFixed(1);
                audioSize.innerText = `${kb} KB (MP3 Neural)`;

                // Display download card
                audioOutputCard.classList.remove('hidden');
                setStatus(`Áudio neural gerado com sucesso (${kb} KB)!`, 'success');

            } catch (error) {
                console.error("Erro ao gerar áudio:", error);
                setStatus('Erro ao conectar com o serviço neural. Verifique sua conexão.', 'error');
            } finally {
                // Restore UI state
                btnGerar.disabled = false;
                btnOuvir.disabled = false;
                btnGerar.classList.remove('opacity-60', 'cursor-not-allowed');
                btnGerarTexto.innerText = "Gerar & Baixar Áudio (.mp3)";
                btnGerarIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>`;
                btnGerarIcon.classList.remove('animate-spin');
            }
        });
    </script>
</body>
</html>
